handler: src/handlers/keto/coachDeleteUser.handler
memorySize: 128
timeout: 10
events:
  - http:
      path: coach/users/{userId}
      method: delete
      authorizer:
        name: cognito-keto-auth
        type: COGNITO_USER_POOLS
        arn: arn:aws:cognito-idp:${aws:region}:${aws:accountId}:userpool/${ssm:/myapp/userpool-id}
      cors:
        origin: "*"
        headers:
          - Content-Type
          - X-Amz-Date
          - Authorization
          - X-Api-Key
        allowCredentials: false
        methods:
          - OPTIONS
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
