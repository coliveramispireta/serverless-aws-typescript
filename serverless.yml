# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: coliveramispireta
# "service" is the name of this project. This will also be added to your AWS resource names.
service: serverless-crud-guru-challenge

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  environment:
    TABLE_NAME: ${self:service}-tickets-${sls:stage}
    MEMBERS_TABLE: ${self:service}-members-${sls:stage}
    PAYMENTS_TABLE: ${self:service}-payments-${sls:stage}
    AUTH_TOKEN: ${ssm:/crud-guru/${sls:stage}/auth-token}
    USER_POOL_ID: ${ssm:/myapp/userpool-id}
    USER_POOL_NAME: ${ssm:/myapp/userpool-name}
    # ---------- KetoCoach ----------
    KETO_USERS_TABLE: ${self:service}-keto-users-${sls:stage}
    KETO_WEIGHTS_TABLE: ${self:service}-keto-weights-${sls:stage}
    KETO_MEALS_TABLE: ${self:service}-keto-meals-${sls:stage}
    KETO_RECIPES_TABLE: ${self:service}-keto-recipes-${sls:stage}
    KETO_POSTS_TABLE: ${self:service}-keto-posts-${sls:stage}
    KETO_COMMENTS_TABLE: ${self:service}-keto-comments-${sls:stage}
    KETO_CHAT_TABLE: ${self:service}-keto-chat-${sls:stage}
    KETO_ACHIEVEMENTS_TABLE: ${self:service}-keto-achievements-${sls:stage}
    KETO_ENGAGEMENT_TABLE: ${self:service}-keto-engagement-${sls:stage}
    KETO_PUSHSUBS_TABLE: ${self:service}-keto-pushsubs-${sls:stage}
    EVIDENCES_BUCKET: ${self:service}-evidencias-${sls:stage}
    ALLOWED_ORIGINS: "https://d2exyey26zrqxx.cloudfront.net,https://d3rhci7cyrcaj3.cloudfront.net,http://localhost:3000"
    # Lista de correos coach (separados por coma). Si el parámetro no existe aún, queda vacío.
    COACH_EMAILS: ${ssm:/ketocoach/${sls:stage}/coach-emails, ''}
    # Web Push (VAPID). Si los parámetros no existen aún, las notificaciones quedan
    # en modo silencioso y el deploy no falla.
    VAPID_PUBLIC_KEY: ${ssm:/ketocoach/${sls:stage}/vapid-public, ''}
    VAPID_PRIVATE_KEY: ${ssm:/ketocoach/${sls:stage}/vapid-private, ''}
    VAPID_SUBJECT: mailto:contacto@ketoflow.app
  tags:
    project: crud-guru
    owner: colivera
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: arn:aws:logs:${aws:region}:${aws:accountId}:*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource: 
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:provider.environment.TABLE_NAME}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:provider.environment.MEMBERS_TABLE}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:provider.environment.PAYMENTS_TABLE}
        # KetoCoach: acceso a las tablas nuevas (prefijo común) e índices GSI
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:service}-keto-*
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:service}-keto-*/index/*
        # KetoCoach: evidencias fotográficas en S3 privado
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: arn:aws:s3:::${self:provider.environment.EVIDENCES_BUCKET}/*

plugins:
  - serverless-esbuild
  - serverless-offline

# Empaquetado con esbuild. `format: cjs` es CRÍTICO: web-push (CommonJS) hace
# require("crypto") y en bundles ESM eso rompe la Lambda en INIT con
# "Dynamic require of crypto is not supported".
#
# SF v4 trae soporte esbuild nativo que entra en conflicto con el plugin:
# se desactiva explícitamente para usar el plugin de la comunidad.
build:
  esbuild: false

custom:
  esbuild:
    target: node20
    format: cjs
    sourcemap: true

package:
  individually: true

functions: ${file(./serverless-functions/index.yml)}
resources:
  - ${file(./serverless-resources/dynamodb.yml)}
  - ${file(./serverless-resources/s3.yml)}
